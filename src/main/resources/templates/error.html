<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Error - Sistema de Inventario</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <style>
            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .error-container {
                background: white;
                padding: 50px;
                border-radius: 20px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                text-align: center;
                max-width: 600px;
            }
            .error-icon {
                font-size: 80px;
                color: #ef4444;
                margin-bottom: 20px;
            }
            h1 {
                color: #0f172a;
                margin-bottom: 15px;
            }
            p {
                color: #64748b;
                margin-bottom: 30px;
            }
            .btn-home {
                background: #4f46e5;
                color: white;
                padding: 12px 30px;
                border-radius: 10px;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-weight: 600;
                transition: all 0.3s;
            }
            .btn-home:hover {
                background: #4338ca;
                color: white;
                transform: translateY(-2px);
            }
        </style>
    </head>
    <body>
        <div class="error-container">
            <i class="bi bi-exclamation-triangle error-icon"></i>
            <h1>¡Oops! Algo salió mal</h1>
            <p th:text="${message} ?: 'Ha ocurrido un error inesperado. Por favor, intenta nuevamente.'"></p>
            <p th:if="${status}" style="color: #64748b; font-size: 14px;">
                Código de error: <strong th:text="${status}">500</strong>
            </p>
            <a href="/dashboard" class="btn-home">
                <i class="bi bi-house-door"></i> Volver al inicio
            </a>
        </div>
    </body>
</html>
