<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Almacén - Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 30px;">
    
    <div class="container">
        <div class="card" style="border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
            <div class="card-header" style="background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; padding: 25px;">
                <h3><i class="bi bi-building"></i> Inventario: <span th:text="${almacen.nombre}">Almacén</span></h3>
                <p style="margin: 5px 0 0 0; opacity: 0.9;">Código: <span th:text="${almacen.codigo}">ALM001</span></p>
            </div>
            
            <div class="card-body" style="padding: 30px;">
                <div class="mb-4">
                    <a href="/almacenes" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>
                
                <div th:if="${inventario != null and !inventario.isEmpty()}">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Código</th>
                                <th>Cantidad</th>
                                <th>Ubicación</th>
                                <th>Última Actualización</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="inv : ${inventario}">
                                <td><strong th:text="${inv.producto.nombre}">Producto</strong></td>
                                <td th:text="${inv.producto.codigo}">PROD001</td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${inv.cantidad <= 0} ? 'bg-danger' : (${inv.cantidad <= inv.producto.stockMinimo} ? 'bg-warning' : 'bg-success')"
                                          th:text="${inv.cantidad}">
                                        0
                                    </span>
                                </td>
                                <td th:text="${inv.ubicacionEspecifica != null ? inv.ubicacionEspecifica : '-'}">-</td>
                                <td th:text="${inv.fechaUltimaActualizacion != null ? #temporals.format(inv.fechaUltimaActualizacion, 'dd/MM/yyyy HH:mm') : '-'}">-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div th:if="${inventario == null or inventario.isEmpty()}" class="text-center py-5">
                    <i class="bi bi-inbox" style="font-size: 64px; color: #cbd5e1;"></i>
                    <h4 class="mt-3">No hay productos en este almacén</h4>
                    <p class="text-muted">Los productos aparecerán aquí cuando se realicen movimientos</p>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
