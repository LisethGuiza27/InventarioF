<!-- src/main/resources/templates/almacenes/formulario.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Formulario Almacén</h2>
        
        <form th:action="@{/almacenes}" th:method="post" th:object="${almacen}">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label>Código:</label>
                <input type="text" class="form-control" th:field="*{codigo}" required>
            </div>
            
            <div class="mb-3">
                <label>Nombre:</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>
            
            <div class="mb-3">
                <label>Descripción:</label>
                <textarea class="form-control" th:field="*{descripcion}"></textarea>
            </div>
            
            <div class="mb-3">
                <label>Dirección:</label>
                <input type="text" class="form-control" th:field="*{direccion}">
            </div>
            
            <div class="mb-3">
                <label>Ciudad:</label>
                <input type="text" class="form-control" th:field="*{ciudad}">
            </div>
            
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/almacenes" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
