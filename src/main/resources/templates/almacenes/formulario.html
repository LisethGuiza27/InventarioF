<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Formulario Almacén</h2>
        
        <form th:action="@{/almacenes}" th:method="post" th:object="${almacen}">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label>Código:</label>
                <input type="text" class="form-control" th:field="*{codigo}" required>
            </div>
            
            <div class="mb-3">
                <label>Nombre:</label>
                <input type="text" class="form-control" th:field="*{nombre}" required>
            </div>
            
            <div class="mb-3">
                <label>Descripción:</label>
                <textarea class="form-control" th:field="*{descripcion}"></textarea>
            </div>
            
            <div class="mb-3">
                <label>Dirección:</label>
                <input type="text" class="form-control" th:field="*{direccion}">
            </div>
            
            <div class="mb-3">
                <label>Ciudad:</label>
                <input type="text" class="form-control" th:field="*{ciudad}">
            </div>
            
            <!-- Agregar en almacenes/formulario.html antes del botón guardar -->
            <div class="form-check mb-3">
                <input type="checkbox" class="form-check-input" id="activo" 
                       th:field="*{activo}" checked>
                <label class="form-check-label" for="activo">
                    Almacén Activo
                </label>
            </div>

            <!-- Para usuario responsable -->
            <div class="mb-3">
                <label>Usuario Responsable:</label>
                <select class="form-control" name="usuarioResponsableId">
                    <option value="">-- Seleccione --</option>
                    <option th:each="u : ${usuarios}" 
                            th:value="${u.id}" 
                            th:text="${u.nombreCompleto}"
                            th:selected="${almacen.usuarioResponsable != null and almacen.usuarioResponsable.id == u.id}">
                    </option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/almacenes" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
