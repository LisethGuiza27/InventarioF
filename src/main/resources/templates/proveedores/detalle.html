<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 30px;">
    
    <div class="container">
        <div class="card" style="border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
            <div class="card-header" style="background: linear-gradient(135deg, #4f46e5, #4338ca); color: white; padding: 25px;">
                <h3><i class="bi bi-truck"></i> Detalle del Proveedor</h3>
            </div>
            
            <div class="card-body" style="padding: 30px;">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="fw-bold">Código:</label>
                        <p th:text="${proveedor.codigo}">PROV001</p>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold">Nombre:</label>
                        <p th:text="${proveedor.nombre}">Proveedor</p>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="fw-bold">Razón Social:</label>
                        <p th:text="${proveedor.razonSocial != null ? proveedor.razonSocial : '-'}">-</p>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold">RUC:</label>
                        <p th:text="${proveedor.ruc != null ? proveedor.ruc : '-'}">-</p>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="fw-bold">Teléfono:</label>
                        <p th:text="${proveedor.telefono}">-</p>
                    </div>
                    <div class="col-md-6">
                        <label class="fw-bold">Email:</label>
                        <p th:text="${proveedor.email}">-</p>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-12">
                        <label class="fw-bold">Dirección:</label>
                        <p th:text="${proveedor.direccion != null ? proveedor.direccion : '-'}">-</p>
                    </div>
                </div>
                
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="fw-bold">Ciudad:</label>
                        <p th:text="${proveedor.ciudad != null ? proveedor.ciudad : '-'}">-</p>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold">País:</label>
                        <p th:text="${proveedor.pais != null ? proveedor.pais : '-'}">-</p>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold">Estado:</label>
                        <p>
                            <span th:if="${proveedor.activo}" class="badge bg-success">Activo</span>
                            <span th:if="${!proveedor.activo}" class="badge bg-danger">Inactivo</span>
                        </p>
                    </div>
                </div>
                
                <hr>
                
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label class="fw-bold">Días de Crédito:</label>
                        <p th:text="${proveedor.diasCredito != null ? proveedor.diasCredito : '0'}">0</p>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold">Límite de Crédito:</label>
                        <p>$<span th:text="${proveedor.limiteCredito != null ? #numbers.formatDecimal(proveedor.limiteCredito, 1, 'COMMA', 2, 'POINT') : '0.00'}">0.00</span></p>
                    </div>
                    <div class="col-md-4">
                        <label class="fw-bold">Saldo Pendiente:</label>
                        <p class="text-danger fw-bold">$<span th:text="${proveedor.saldoPendiente != null ? #numbers.formatDecimal(proveedor.saldoPendiente, 1, 'COMMA', 2, 'POINT') : '0.00'}">0.00</span></p>
                    </div>
                </div>
                
                <div class="mt-4">
                    <a href="/proveedores" class="btn btn-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                    <a th:href="@{/proveedores/{id}/editar(id=${proveedor.id})}" class="btn btn-primary">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                </div>
            </div>
        </div>
    </div>
    
</body>
</html>
