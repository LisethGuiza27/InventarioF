<!-- src/main/resources/templates/proveedores/listado.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-4">
        <h2><i class="bi bi-truck"></i> Proveedores</h2>
        
        <a href="/proveedores/nuevo" class="btn btn-success mb-3">
            <i class="bi bi-plus-circle"></i> Nuevo Proveedor
        </a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>RUC</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${proveedores}">
                    <td th:text="${p.codigo}"></td>
                    <td th:text="${p.nombre}"></td>
                    <td th:text="${p.ruc}"></td>
                    <td th:text="${p.telefono}"></td>
                    <td th:text="${p.email}"></td>
                    <td>
                        <a th:href="@{/proveedores/{id}/editar(id=${p.id})}" class="btn btn-sm btn-primary">Editar</a>
                        <a th:href="@{/proveedores/{id}/detalle(id=${p.id})}" class="btn btn-sm btn-info">Ver</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
