<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos Más Vendidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 30px;">
    <div class="container">
        <div class="card" style="border-radius: 16px;">
            <div class="card-header bg-warning text-dark">
                <h3>Top <span th:text="${top}">10</span> Productos Más Vendidos</h3>
            </div>
            <div class="card-body">
                <a href="/reportes" class="btn btn-secondary mb-3">Volver</a>
                
                <table class="table table-striped" th:if="${productos != null and !productos.isEmpty()}">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Producto</th>
                            <th>Cantidad Vendida</th>
                            <th>Valor Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item, iterStat : ${productos}">
                            <td th:text="${iterStat.count}"></td>
                            <td th:text="${item.producto.nombre}"></td>
                            <td th:text="${item.cantidadVendida}"></td>
                            <td>$<span th:text="${#numbers.formatDecimal(item.valorTotal, 1, 'COMMA', 2, 'POINT')}"></span></td>
                        </tr>
                    </tbody>
                </table>
                
                <div th:if="${productos == null or productos.isEmpty()}" class="text-center py-5">
                    <h4>No hay datos disponibles</h4>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
