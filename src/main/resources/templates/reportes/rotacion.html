<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Rotación de Inventario</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 30px;">
        <div class="container">
            <div class="card" style="border-radius: 16px;">
                <div class="card-header bg-success text-white">
                    <h3>Rotación de Inventario</h3>
                    <p class="mb-0">Periodo: <span th:text="${#temporals.format(desde, 'dd/MM/yyyy')}"></span> - <span th:text="${#temporals.format(hasta, 'dd/MM/yyyy')}"></span></p>
                </div>
                <div class="card-body">
                    <a href="/reportes" class="btn btn-secondary mb-3">Volver</a>

                    <table class="table table-striped" th:if="${reporte != null and reporte.productos != null and !reporte.productos.isEmpty()}">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Total Salidas</th>
                                <th>Stock Promedio</th>
                                <th>Índice de Rotación</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${reporte.productos}">
                                <td th:text="${item.producto.nombre}"></td>
                                <td th:text="${item.totalSalidas}"></td>
                                <td th:text="${item.stockPromedio}"></td>
                                <td>
                                    <span class="badge" 
                                          th:classappend="${item.rotacion >= 1} ? 'bg-success' : 'bg-warning'"
                                          th:text="${#numbers.formatDecimal(item.rotacion, 1, 2)}">
                                        0.00
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div th:if="${reporte == null or reporte.productos == null or reporte.productos.isEmpty()}" class="text-center py-5">
                        <h4>No hay datos para el periodo seleccionado</h4>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
