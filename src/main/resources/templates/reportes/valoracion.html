<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Valoración de Inventario</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    </head>
    <body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 30px;">
        <div class="container">
            <div class="card" style="border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);">
                <div class="card-header" style="background: linear-gradient(135deg, #06b6d4, #0891b2); color: white; padding: 25px;">
                    <h3><i class="bi bi-currency-dollar"></i> Valoración de Inventario</h3>
                    <p class="mb-0">Análisis financiero del inventario</p>
                </div>

                <div class="card-body" style="padding: 30px;">
                    <a href="/reportes" class="btn btn-secondary mb-4">
                        <i class="bi bi-arrow-left"></i> Volver a Reportes
                    </a>

                    <div class="row mb-4" th:if="${reporte != null}">
                        <div class="col-md-3">
                            <div class="card text-center" style="border-left: 4px solid #10b981;">
                                <div class="card-body">
                                    <h6 class="text-muted">Valor Venta</h6>
                                    <h3 class="text-success">$<span th:text="${#numbers.formatDecimal(reporte.valorVenta, 1, 'COMMA', 2, 'POINT')}">0.00</span></h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-center" style="border-left: 4px solid #3b82f6;">
                                <div class="card-body">
                                    <h6 class="text-muted">Valor Compra</h6>
                                    <h3 class="text-primary">$<span th:text="${#numbers.formatDecimal(reporte.valorCompra, 1, 'COMMA', 2, 'POINT')}">0.00</span></h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-center" style="border-left: 4px solid #f59e0b;">
                                <div class="card-body">
                                    <h6 class="text-muted">Utilidad Potencial</h6>
                                    <h3 class="text-warning">$<span th:text="${#numbers.formatDecimal(reporte.utilidadPotencial, 1, 'COMMA', 2, 'POINT')}">0.00</span></h3>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-center" style="border-left: 4px solid #8b5cf6;">
                                <div class="card-body">
                                    <h6 class="text-muted">Margen Promedio</h6>
                                    <h3 style="color: #8b5cf6;"><span th:text="${#numbers.formatDecimal(reporte.margenPromedio, 1, 2)}">0.00</span>%</h3>
                                </div>
                            </div>
                        </div>
                    </div>

                    <h4 class="mt-4 mb-3">Top 10 Productos Más Valiosos</h4>
                    <div class="table-responsive" th:if="${reporte != null and reporte.topProductos != null}">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Producto</th>
                                    <th>Stock</th>
                                    <th>Precio Venta</th>
                                    <th>Valor Total</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item, iterStat : ${reporte.topProductos}">
                                    <td th:text="${iterStat.count}">1</td>
                                    <td th:text="${item.producto.nombre}">Producto</td>
                                    <td th:text="${item.producto.stockActual}">0</td>
                                    <td>$<span th:text="${#numbers.formatDecimal(item.producto.precioVenta, 1, 'COMMA', 2, 'POINT')}">0.00</span></td>
                                    <td><strong>$<span th:text="${#numbers.formatDecimal(item.valor, 1, 'COMMA', 2, 'POINT')}">0.00</span></strong></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div th:if="${reporte == null}" class="text-center py-5">
                        <i class="bi bi-inbox" style="font-size: 64px; color: #cbd5e1;"></i>
                        <h4 class="mt-3">No hay datos disponibles</h4>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
