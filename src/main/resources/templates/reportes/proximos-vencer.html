<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Productos Próximos a Vencer</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 30px;">
        <div class="container">
            <div class="card" style="border-radius: 16px;">
                <div class="card-header bg-danger text-white">
                    <h3>Productos Próximos a Vencer</h3>
                    <p class="mb-0">Próximos <span th:text="${dias}">30</span> días</p>
                </div>
                <div class="card-body">
                    <a href="/reportes" class="btn btn-secondary mb-3">Volver</a>

                    <table class="table table-striped" th:if="${productos != null and !productos.isEmpty()}">
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Producto</th>
                                <th>Stock</th>
                                <th>Fecha Vencimiento</th>
                                <th>Días Restantes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td th:text="${p.codigo}"></td>
                                <td th:text="${p.nombre}"></td>
                                <td th:text="${p.stockActual}"></td>
                                <td th:text="${#temporals.format(p.fechaVencimiento, 'dd/MM/yyyy')}"></td>
                                <td>
                                    <span class="badge bg-danger" 
                                          th:text="${#temporals.until(#temporals.createNow(), p.fechaVencimiento, 'DAYS')}">
                                        0
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                    <div th:if="${productos == null or productos.isEmpty()}" class="text-center py-5">
                        <i class="bi bi-check-circle text-success" style="font-size: 64px;"></i>
                        <h4>No hay productos próximos a vencer</h4>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
