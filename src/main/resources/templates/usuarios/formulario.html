<!-- src/main/resources/templates/usuarios/formulario.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Formulario Usuario</h2>
        
        <form th:action="@{/usuarios}" th:method="post" th:object="${usuario}">
            <input type="hidden" th:field="*{id}">
            
            <div class="mb-3">
                <label>Username:</label>
                <input type="text" class="form-control" th:field="*{username}" required>
            </div>
            
            <div class="mb-3" th:if="${usuario.id == null}">
                <label>Contraseña:</label>
                <input type="password" class="form-control" th:field="*{password}" required>
            </div>
            
            <div class="mb-3">
                <label>Nombre Completo:</label>
                <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
            </div>
            
            <div class="mb-3">
                <label>Email:</label>
                <input type="email" class="form-control" th:field="*{email}">
            </div>
            
            <div class="mb-3">
                <label>Rol:</label>
                <select class="form-control" th:field="*{rol}">
                    <option th:each="rol : ${roles}" 
                            th:value="${rol.id}" 
                            th:text="${rol.nombre}"></option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/usuarios" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
