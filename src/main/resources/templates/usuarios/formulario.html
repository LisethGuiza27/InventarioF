<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario Usuario - Sistema de Inventario</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --primary: #4f46e5;
                --success: #10b981;
                --danger: #ef4444;
                --dark: #0f172a;
                --gray: #64748b;
                --gray-light: #f1f5f9;
                --white: #ffffff;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 30px;
            }

            .form-card {
                background: var(--white);
                border-radius: 16px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                max-width: 900px;
                margin: 0 auto;
                overflow: hidden;
            }

            .form-header {
                background: linear-gradient(135deg, var(--primary), #4338ca);
                color: white;
                padding: 30px;
            }

            .form-body {
                padding: 40px;
            }

            .section-title {
                font-size: 18px;
                font-weight: 600;
                color: var(--primary);
                margin: 30px 0 20px 0;
                padding-bottom: 10px;
                border-bottom: 2px solid var(--gray-light);
            }

            .section-title:first-child {
                margin-top: 0;
            }

            .form-label {
                font-size: 14px;
                font-weight: 600;
                color: var(--dark);
                margin-bottom: 8px;
            }

            .required {
                color: var(--danger);
            }

            .form-control, .form-select {
                padding: 12px 16px;
                border: 2px solid #e2e8f0;
                border-radius: 10px;
                font-size: 15px;
                transition: all 0.3s;
            }

            .form-control:focus, .form-select:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            }

            .input-group-text {
                background: var(--gray-light);
                border: 2px solid #e2e8f0;
                border-right: none;
                border-radius: 10px 0 0 10px;
                font-weight: 600;
                color: var(--gray);
            }

            .input-group .form-control {
                border-left: none;
                border-radius: 0 10px 10px 0;
            }

            .btn-modern {
                padding: 14px 28px;
                border-radius: 10px;
                font-weight: 600;
                border: none;
                cursor: pointer;
                transition: all 0.3s ease;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                text-decoration: none;
            }

            .btn-primary {
                background: var(--primary);
                color: white;
            }
            .btn-secondary {
                background: var(--gray);
                color: white;
            }

            .btn-modern:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            }

            .form-actions {
                display: flex;
                gap: 15px;
                justify-content: flex-end;
                padding-top: 30px;
                border-top: 2px solid var(--gray-light);
                margin-top: 30px;
            }

            .password-toggle {
                position: relative;
            }

            .password-toggle-btn {
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                border: none;
                color: var(--gray);
                cursor: pointer;
                font-size: 18px;
                padding: 0;
                z-index: 10;
            }

            .password-toggle-btn:hover {
                color: var(--primary);
            }

            .form-hint {
                font-size: 13px;
                color: var(--gray);
                margin-top: 5px;
            }
        </style>
    </head>
    <body>
        <div class="form-card">
            <div class="form-header">
                <h2>
                    <i class="bi bi-person-circle"></i>
                    <span th:if="${usuario.id == null}">Nuevo Usuario</span>
                    <span th:if="${usuario.id != null}">Editar Usuario</span>
                </h2>
            </div>

            <div class="form-body">
                <form th:action="${usuario.id != null} ? @{/usuarios/{id}(id=${usuario.id})} : @{/usuarios}" 
                      th:object="${usuario}" 
                      method="post">

                    <!-- Información de Acceso -->
                    <div class="section-title">
                        <i class="bi bi-key"></i> Información de Acceso
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">
                                Nombre de Usuario <span class="required">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       th:field="*{username}"
                                       placeholder="Ej: juanperez" 
                                       required
                                       maxlength="50">
                            </div>
                            <div class="form-hint">Usuario único para iniciar sesión</div>
                        </div>

                        <div class="col-md-6 mb-3" th:if="${usuario.id == null}">
                            <label for="password" class="form-label">
                                Contraseña <span class="required">*</span>
                            </label>
                            <div class="input-group password-toggle">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       th:field="*{password}"
                                       placeholder="Mínimo 6 caracteres" 
                                       required
                                       minlength="6">
                                <button type="button" class="password-toggle-btn" onclick="togglePassword()">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                            <div class="form-hint">Mínimo 6 caracteres</div>
                        </div>
                    </div>

                    <!-- Información Personal -->
                    <div class="section-title">
                        <i class="bi bi-person-vcard"></i> Información Personal
                    </div>

                    <div class="mb-3">
                        <label for="nombreCompleto" class="form-label">
                            Nombre Completo <span class="required">*</span>
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                            <input type="text" 
                                   class="form-control" 
                                   id="nombreCompleto" 
                                   th:field="*{nombreCompleto}"
                                   placeholder="Nombre y apellidos completos" 
                                   required
                                   maxlength="200">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Correo Electrónico
                        </label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" 
                                   class="form-control" 
                                   id="email" 
                                   th:field="*{email}"
                                   placeholder="usuario@ejemplo.com"
                                   maxlength="100">
                        </div>
                        <div class="form-hint">Opcional - Para recuperación de contraseña</div>
                    </div>

                    <!-- Rol y Permisos -->
                    <div class="section-title">
                        <i class="bi bi-shield-check"></i> Rol y Permisos
                    </div>

                    <div class="mb-3">
                        <label for="rolId" class="form-label">
                            Rol de Usuario <span class="required">*</span>
                        </label>
                        <select class="form-select" id="rolId" name="rolId" required>
                            <option value="">-- Seleccione un rol --</option>
                            <option th:each="rol : ${roles}" 
                                    th:value="${rol.id}" 
                                    th:text="${rol.nombre}"
                                    th:selected="${usuario.rol != null and usuario.rol.id == rol.id}">
                            </option>
                        </select>
                        <div class="form-hint">Define los permisos y accesos del usuario</div>
                    </div>

                    <!-- Acciones -->
                    <div class="form-actions">
                        <a href="/usuarios" class="btn-modern btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                        <button type="submit" class="btn-modern btn-primary">
                            <i class="bi bi-save"></i> Guardar Usuario
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            // Toggle para mostrar/ocultar contraseña
            function togglePassword() {
                const passwordInput = document.getElementById('password');
                const toggleIcon = document.getElementById('toggleIcon');

                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.classList.remove('bi-eye');
                    toggleIcon.classList.add('bi-eye-slash');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.classList.remove('bi-eye-slash');
                    toggleIcon.classList.add('bi-eye');
                }
            }

            // Validación del formulario
            document.querySelector('form').addEventListener('submit', function (e) {
                const username = document.getElementById('username').value.trim();

                if (username.length < 3) {
                    alert('El nombre de usuario debe tener al menos 3 caracteres');
                    e.preventDefault();
                    return false;
                }

                const usernameRegex = /^[a-zA-Z0-9_-]+$/;
                if (!usernameRegex.test(username)) {
                    alert('El nombre de usuario solo puede contener letras, números, guiones y guiones bajos');
                    e.preventDefault();
                    return false;
                }
            });
        </script>
    </body>
</html>
