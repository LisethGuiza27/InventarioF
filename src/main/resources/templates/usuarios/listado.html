<!-- src/main/resources/templates/usuarios/listado.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-4">
        <h2><i class="bi bi-person-gear"></i> Usuarios</h2>
        
        <a href="/usuarios/nuevo" class="btn btn-success mb-3">
            <i class="bi bi-plus-circle"></i> Nuevo Usuario
        </a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Nombre Completo</th>
                    <th>Email</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.nombreCompleto}"></td>
                    <td th:text="${u.email}"></td>
                    <td th:text="${u.rol.nombre}"></td>
                    <td>
                        <span th:if="${u.activo}" class="badge bg-success">Activo</span>
                        <span th:if="${!u.activo}" class="badge bg-danger">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{/usuarios/{id}/editar(id=${u.id})}" class="btn btn-sm btn-primary">Editar</a>
                        <a th:if="${u.activo}" th:href="@{/usuarios/{id}/desactivar(id=${u.id})}" 
                           class="btn btn-sm btn-warning">Desactivar</a>
                        <a th:if="${!u.activo}" th:href="@{/usuarios/{id}/activar(id=${u.id})}" 
                           class="btn btn-sm btn-success">Activar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
