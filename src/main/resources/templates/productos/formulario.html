<!-- FORMULARIO DE PRODUCTO CORREGIDO -->
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario Producto - Sistema de Inventario</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --primary: #4f46e5;
                --success: #10b981;
                --danger: #ef4444;
                --dark: #0f172a;
                --gray: #64748b;
                --gray-light: #f1f5f9;
                --white: #ffffff;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Inter', sans-serif;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                min-height: 100vh;
                padding: 30px 0;
            }

            .form-card {
                background: var(--white);
                border-radius: 16px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
                max-width: 900px;
                margin: 0 auto;
                overflow: hidden;
            }

            .form-header {
                background: linear-gradient(135deg, var(--primary), #4338ca);
                color: white;
                padding: 30px;
            }

            .form-body {
                padding: 40px;
            }

            .section-title {
                font-size: 18px;
                font-weight: 600;
                color: var(--primary);
                margin: 30px 0 20px 0;
                padding-bottom: 10px;
                border-bottom: 2px solid var(--gray-light);
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .section-title:first-child {
                margin-top: 0;
            }

            .form-label {
                font-size: 14px;
                font-weight: 600;
                color: var(--dark);
                margin-bottom: 8px;
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .required {
                color: var(--danger);
            }

            .form-control, .form-select {
                padding: 12px 16px;
                border: 2px solid #e2e8f0;
                border-radius: 10px;
                font-size: 15px;
                transition: all 0.3s;
            }

            .form-control:focus, .form-select:focus {
                outline: none;
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
            }

            .input-group-text {
                background: var(--gray-light);
                border: 2px solid #e2e8f0;
                border-right: none;
                border-radius: 10px 0 0 10px;
                font-weight: 600;
                color: var(--gray);
            }

            .input-group .form-control {
                border-left: none;
                border-radius: 0 10px 10px 0;
            }

            .form-check-input {
                width: 24px;
                height: 24px;
                border: 2px solid #e2e8f0;
                border-radius: 6px;
                cursor: pointer;
            }

            .form-check-input:checked {
                background-color: var(--primary);
                border-color: var(--primary);
            }

            .form-check-label {
                margin-left: 10px;
                font-weight: 500;
                cursor: pointer;
            }

            .btn-modern {
                padding: 14px 28px;
                border-radius: 10px;
                font-weight: 600;
                border: none;
                cursor: pointer;
                transition: all 0.3s ease;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                text-decoration: none;
                font-size: 15px;
            }

            .btn-primary {
                background: var(--primary);
                color: white;
            }

            .btn-primary:hover {
                background: #4338ca;
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
            }

            .btn-secondary {
                background: var(--gray);
                color: white;
            }

            .btn-secondary:hover {
                background: #475569;
                transform: translateY(-2px);
            }

            .form-actions {
                display: flex;
                gap: 15px;
                justify-content: flex-end;
                padding-top: 30px;
                border-top: 2px solid var(--gray-light);
                margin-top: 30px;
            }

            .form-hint {
                font-size: 13px;
                color: var(--gray);
                margin-top: 5px;
            }
        </style>
    </head>
    <body>
        <div class="form-card">
            <div class="form-header">
                <h2>
                    <i class="bi bi-pencil-square"></i>
                    <span th:if="${producto.id == null}">Nuevo Producto</span>
                    <span th:if="${producto.id != null}">Editar Producto</span>
                </h2>
            </div>

            <div class="form-body">
                <!-- ✅ CORRECCIÓN CRÍTICA: Acción dinámica según si es crear o editar -->
                <form th:action="@{${producto.id != null ? '/productos/' + producto.id : '/productos'}}" 
                      th:object="${producto}" 
                      method="post">

                    <!-- Información Básica -->
                    <div class="section-title">
                        <i class="bi bi-info-circle"></i> Información Básica
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="codigo" class="form-label">
                                Código <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" id="codigo" 
                                   th:field="*{codigo}"
                                   placeholder="Ej: PROD001" 
                                   required
                                   maxlength="50">
                            <div class="form-hint">Código único del producto</div>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">
                                Nombre <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" id="nombre" 
                                   th:field="*{nombre}"
                                   placeholder="Nombre del producto" 
                                   required
                                   maxlength="200">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" 
                                  th:field="*{descripcion}"
                                  rows="3" 
                                  placeholder="Descripción detallada del producto"
                                  maxlength="500"></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="categoriaId" class="form-label">Categoría</label>
                            <select class="form-select" id="categoriaId" name="categoriaId">
                                <option value="">-- Seleccione --</option>
                                <option th:each="cat : ${categorias}" 
                                        th:value="${cat.id}" 
                                        th:text="${cat.nombre}"
                                        th:selected="${producto.categoria != null and producto.categoria.id == cat.id}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="proveedorId" class="form-label">Proveedor</label>
                            <select class="form-select" id="proveedorId" name="proveedorId">
                                <option value="">-- Seleccione --</option>
                                <option th:each="prov : ${proveedores}" 
                                        th:value="${prov.id}" 
                                        th:text="${prov.razonSocial}"
                                        th:selected="${producto.proveedor != null and producto.proveedor.id == prov.id}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="unidadMedida" class="form-label">Unidad de Medida</label>
                            <select class="form-select" id="unidadMedida" th:field="*{unidadMedida}">
                                <option value="UND">Unidad</option>
                                <option value="KG">Kilogramo</option>
                                <option value="LT">Litro</option>
                                <option value="MT">Metro</option>
                                <option value="CAJA">Caja</option>
                            </select>
                        </div>
                    </div>

                    <!-- Precios -->
                    <div class="section-title">
                        <i class="bi bi-currency-dollar"></i> Precios
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="precioVenta" class="form-label">
                                Precio Venta <span class="required">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="precioVenta" 
                                       th:field="*{precioVenta}"
                                       step="0.01" min="0" required>
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="precioCompra" class="form-label">Precio Compra</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="precioCompra" 
                                       th:field="*{precioCompra}"
                                       step="0.01" min="0">
                            </div>
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="precioMayoreo" class="form-label">Precio Mayoreo</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="precioMayoreo" 
                                       th:field="*{precioMayoreo}"
                                       step="0.01" min="0">
                            </div>
                        </div>
                    </div>

                    <!-- Inventario -->
                    <div class="section-title">
                        <i class="bi bi-boxes"></i> Control de Inventario
                    </div>

                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label for="stockActual" class="form-label">Stock Actual</label>
                            <input type="number" class="form-control" id="stockActual" 
                                   th:field="*{stockActual}"
                                   min="0" value="0">
                        </div>

                        <div class="col-md-3 mb-3">
                            <label for="stockMinimo" class="form-label">Stock Mínimo</label>
                            <input type="number" class="form-control" id="stockMinimo" 
                                   th:field="*{stockMinimo}"
                                   min="0" value="0">
                            <div class="form-hint">Alerta de stock bajo</div>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label for="stockMaximo" class="form-label">Stock Máximo</label>
                            <input type="number" class="form-control" id="stockMaximo" 
                                   th:field="*{stockMaximo}"
                                   min="0">
                        </div>

                        <div class="col-md-3 mb-3">
                            <label for="puntoReorden" class="form-label">Punto de Reorden</label>
                            <input type="number" class="form-control" id="puntoReorden" 
                                   th:field="*{puntoReorden}"
                                   min="0">
                        </div>
                    </div>

                    <!-- Estado -->
                    <div class="section-title">
                        <i class="bi bi-toggle-on"></i> Estado
                    </div>

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="activo" 
                               th:field="*{activo}" checked>
                        <label class="form-check-label" for="activo">
                            <strong>Producto Activo</strong>
                            <div class="form-hint">Los productos inactivos no aparecen en movimientos</div>
                        </label>
                    </div>

                    <!-- Acciones -->
                    <div class="form-actions">
                        <a href="/productos" class="btn-modern btn-secondary">
                            <i class="bi bi-x-circle"></i> Cancelar
                        </a>
                        <button type="submit" class="btn-modern btn-primary">
                            <i class="bi bi-save"></i> Guardar Producto
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            // Validación del formulario
            document.querySelector('form').addEventListener('submit', function (e) {
                const precioVenta = parseFloat(document.getElementById('precioVenta').value);
                const precioCompra = parseFloat(document.getElementById('precioCompra').value);

                if (precioCompra && precioVenta < precioCompra) {
                    if (!confirm('El precio de venta es menor que el precio de compra. ¿Desea continuar?')) {
                        e.preventDefault();
                    }
                }
            });
        </script>
    </body>
</html>
