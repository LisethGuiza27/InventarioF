<!-- src/main/resources/templates/clientes/formulario.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Formulario Cliente</h2>
        
        <form th:action="@{/clientes}" th:method="post" th:object="${cliente}">
            <input type="hidden" th:field="*{id}">
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Código:</label>
                    <input type="text" class="form-control" th:field="*{codigo}" required>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label>Nombre:</label>
                    <input type="text" class="form-control" th:field="*{nombre}" required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Tipo Documento:</label>
                    <select class="form-control" th:field="*{tipoDocumento}">
                        <option value="">Seleccione...</option>
                        <option value="DNI">DNI</option>
                        <option value="RUC">RUC</option>
                        <option value="CE">CE</option>
                    </select>
                </div>
                
                <div class="col-md-6 mb-3">
                    <label>Número Documento:</label>
                    <input type="text" class="form-control" th:field="*{numeroDocumento}">
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Teléfono:</label>
                    <input type="text" class="form-control" th:field="*{telefono}">
                </div>
                
                <div class="col-md-6 mb-3">
                    <label>Email:</label>
                    <input type="email" class="form-control" th:field="*{email}">
                </div>
            </div>
            
            <div class="mb-3">
                <label>Dirección:</label>
                <input type="text" class="form-control" th:field="*{direccion}">
            </div>
            
            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/clientes" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
