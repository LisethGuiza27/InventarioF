<!-- src/main/resources/templates/clientes/listado.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-4">
        <h2><i class="bi bi-people"></i> Clientes</h2>
        
        <a href="/clientes/nuevo" class="btn btn-success mb-3">
            <i class="bi bi-plus-circle"></i> Nuevo Cliente
        </a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Documento</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${clientes}">
                    <td th:text="${c.codigo}"></td>
                    <td th:text="${c.nombre}"></td>
                    <td th:text="${c.numeroDocumento}"></td>
                    <td th:text="${c.telefono}"></td>
                    <td th:text="${c.email}"></td>
                    <td>
                        <a th:href="@{/clientes/{id}/editar(id=${c.id})}" class="btn btn-sm btn-primary">Editar</a>
                        <a th:href="@{/clientes/{id}/detalle(id=${c.id})}" class="btn btn-sm btn-info">Ver</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
